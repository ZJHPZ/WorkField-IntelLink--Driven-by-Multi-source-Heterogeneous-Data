services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ../职域智联图谱/data:/data:ro
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7474:7474"   # HTTP
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/zhiyu2024
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "zhiyu2024", "RETURN 1"]
      interval: 5s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: zhiyu
      POSTGRES_PASSWORD: zhiyu2024
      POSTGRES_DB: zhiyu_kg
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhiyu -d zhiyu_kg"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  postgres_data:
