[project]
name = "zhiyu-zhilian-tupu"
version = "2.0.0"
description = "职域智联图谱 — 多源异构数据驱动岗位和能力图谱构建与动态演化分析"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "neo4j>=5.25",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "openai>=2.0",
    "python-multipart>=0.0.12",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "xlrd>=2.0",
    "jieba>=0.42",
    "numpy>=2.0",
    "scipy>=1.14",
    "httpx>=0.28",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.12",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q --cov=app --cov-report=term-missing"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
strict = false

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"
